# Runs MandiPlus Dashboard (desktop/, the Windows app, flavor 'desktop') on a Windows runner:
# smoke test from inside the page, a real install with screenshots, and optionally a self-update
# from the exe an earlier run kept. Tests the published exe, or with build=true one built here
# from this commit (plus a console copy, whose crashes show in the log).
# Started by hand: Actions → desktop-smoke → Run workflow.
name: desktop-smoke
on:
  workflow_dispatch:
    inputs:
      from_run:
        description: Run id whose app.exe to update from (blank skips the update test)
        required: false
      build:
        description: Build desktop/ at this commit instead of downloading the published exe
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        if: inputs.build
      - uses: actions/setup-go@v5
        if: inputs.build
        with:
          go-version: '1.20.14'
          cache: false
      - name: Build from source
        if: inputs.build
        working-directory: desktop
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --in winres/winres.json --arch amd64 --product-version 0.0.0.1 --file-version 0.0.0.1
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=dev" -o ..\app.exe .
          go build -trimpath -ldflags "-X main.version=dev" -o ..\app-console.exe .
          ..\app-console.exe --version

      - name: Screenshot helper
        run: |
          @'
          param($out)
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save($out)
          '@ | Set-Content shot.ps1
          mkdir out | Out-Null

      - name: WebView2 runtime
        run: |
          $k = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (-not (Test-Path $k)) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile wv2.exe
            Start-Process .\wv2.exe -ArgumentList '/silent', '/install' -Wait
          }
          "runtime: $((Get-ItemProperty $k).pv)"
          Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\*\EBWebView' | Select-Object FullName
          [Environment]::OSVersion.VersionString

      - name: Download the published exe
        if: ${{ !inputs.build }}
        run: |
          $r = Invoke-WebRequest 'https://mandipos-api.onrender.com/v1/public/app/download?flavor=desktop' -OutFile app.exe -PassThru
          "version: $($r.Headers['X-App-Version'])"

      - name: About the exe
        run: |
          (Get-FileHash app.exe).Hash
          (Get-Item app.exe).VersionInfo | Format-List ProductName, FileDescription, ProductVersion
          Copy-Item app.exe out\app.exe

      - name: Smoke test
        run: |
          $p = Start-Process .\app.exe -ArgumentList '--smoke', "$PWD\out\smoke.json" -PassThru
          for ($i = 0; $i -lt 150 -and -not (Test-Path out\smoke.json) -and -not $p.HasExited; $i++) { Start-Sleep 1 }
          "exited: $($p.HasExited) code: $(if ($p.HasExited) { $p.ExitCode })"
          Start-Sleep 4
          .\shot.ps1 out\print-preview.png
          Get-Content "$env:LOCALAPPDATA\MandiPlus Dashboard\dashboard.log" -ErrorAction SilentlyContinue
          Get-Content out\smoke.json
          $p.WaitForExit(30000) | Out-Null

      - name: Typing
        run: |
          # Real keyboard input (SendKeys), with a trip to Notepad in between: activation must
          # hand the keyboard back to the page. Never Enter: no OTP goes out.
          $p = Start-Process .\app.exe -ArgumentList '--typing', "$PWD\out\typing.json", '--home', "$PWD\out\typing-home" -PassThru
          Start-Sleep 12
          $w = New-Object -ComObject WScript.Shell
          $w.AppActivate($p.Id) | Out-Null; Start-Sleep 1
          $w.SendKeys('90223'); Start-Sleep 1
          $n = Start-Process notepad -PassThru; Start-Sleep 3
          $w.AppActivate($p.Id) | Out-Null; Start-Sleep 1
          $w.SendKeys('53647'); Start-Sleep 1
          $w.SendKeys('{F2}'); Start-Sleep 1; $w.SendKeys('{ESC}'); Start-Sleep 1
          .\shot.ps1 out\typing.png
          $n | Stop-Process -Force -ErrorAction SilentlyContinue
          for ($i = 0; $i -lt 60 -and -not (Test-Path out\typing.json); $i++) { Start-Sleep 1 }
          Get-Content out\typing.json
          Get-Content out\typing-home\dashboard.log -ErrorAction SilentlyContinue

      - name: Console copy (crash output)
        if: failure() && inputs.build
        run: |
          $p = Start-Process .\app-console.exe -ArgumentList '--smoke', "$PWD\out\smoke-console.json", '--home', "$PWD\out\console-home" -PassThru -RedirectStandardOutput out\console-stdout.txt -RedirectStandardError out\console-stderr.txt
          $p.WaitForExit(150000) | Out-Null
          Get-Content out\console-stdout.txt, out\console-stderr.txt, out\console-home\dashboard.log -ErrorAction SilentlyContinue

      - name: Install like a shop owner
        run: |
          Start-Process .\app.exe
          Start-Sleep 30
          .\shot.ps1 out\window.png
          $d = "$env:LOCALAPPDATA\MandiPlus Dashboard"
          Get-ChildItem $d | Select-Object Name, Length
          Test-Path "$([Environment]::GetFolderPath('Desktop'))\MandiPlus Dashboard.lnk"
          Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\MandiPlus Dashboard.lnk"
          Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MandiPlusDashboard' | Select-Object DisplayName, DisplayVersion, UninstallString
          Get-Process | Where-Object { $_.Path -like '*MandiPlus Dashboard*' -or $_.Path -like '*app.exe' } | Select-Object Id, Path
          Start-Process .\app.exe
          Start-Sleep 5
          "processes after a second start: $((Get-Process | Where-Object { $_.Path -like '*MandiPlus Dashboard*' }).Count)"
          Get-Content "$d\dashboard.log"
          Get-Process | Where-Object { $_.Path -like '*MandiPlus Dashboard*' } | Stop-Process -Force
          Start-Sleep 2
          # Uninstall as Apps & features would, then OK on its message box.
          $u = Start-Process "$d\MandiPlus Dashboard.exe" -ArgumentList '--uninstall' -PassThru
          Start-Sleep 5
          .\shot.ps1 out\uninstall.png
          $w = New-Object -ComObject WScript.Shell
          $w.AppActivate($u.Id) | Out-Null; Start-Sleep 1; $w.SendKeys('~')
          "uninstall exited: $($u.WaitForExit(10000))"
          Start-Sleep 12
          "after uninstall: desktop lnk $(Test-Path "$([Environment]::GetFolderPath('Desktop'))\MandiPlus Dashboard.lnk"), start lnk $(Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\MandiPlus Dashboard.lnk"), reg $(Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MandiPlusDashboard'), folder $(Test-Path $d)"

      - name: Old exe from an earlier run
        if: inputs.from_run != ''
        uses: actions/download-artifact@v4
        with:
          name: desktop-smoke
          path: old
          run-id: ${{ inputs.from_run }}
          github-token: ${{ github.token }}

      - name: Self-update
        if: inputs.from_run != ''
        run: |
          mkdir upd | Out-Null
          Copy-Item old\app.exe upd\app.exe
          "before: $((Get-Item upd\app.exe).VersionInfo.ProductVersion)"
          Start-Process .\upd\app.exe -ArgumentList '--home', "$PWD\upd\home", '--update-now', "$PWD\out\update.txt" -Wait
          Get-Content out\update.txt
          Get-ChildItem upd, upd\home | Select-Object FullName, Length
          Get-Content upd\home\update.json -ErrorAction SilentlyContinue
          "after: $((Get-Item upd\app.exe).VersionInfo.ProductVersion)"
          $p = Start-Process .\upd\app.exe -ArgumentList '--home', "$PWD\upd\home", '--smoke', "$PWD\out\smoke-after-update.json" -PassThru
          for ($i = 0; $i -lt 150 -and -not (Test-Path out\smoke-after-update.json); $i++) { Start-Sleep 1 }
          Get-Content out\smoke-after-update.json
          $p.WaitForExit(30000) | Out-Null
          "pending marker left: $(Test-Path upd\home\update.json); old exe left: $(Test-Path upd\app.exe.old)"
          Get-Content upd\home\dashboard.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke
          path: out
