# Render Blueprint for the Mandi POS backend (production only), in Singapore next to
# the Neon project (aws-ap-southeast-1). Database migrations run before the server
# starts; if one fails the new instance never goes live and the old one keeps serving.

envVarGroups:
  - name: mandipos-production
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL          # Neon pooled URL, role mandipos_api, branch main
        sync: false
      - key: DATABASE_URL_DIRECT   # Neon direct URL, role mandipos_owner, branch main
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: TWOFACTOR_API_KEY
        sync: false
      - key: TWOFACTOR_OTP_TEMPLATE_NAME
        sync: false

services:
  - type: web
    name: mandipos-api
    runtime: node
    region: singapore
    plan: standard
    branch: main
    autoDeploy: false
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node scripts/migrate.mjs && node --max-old-space-size=1536 dist/main.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - fromGroup: mandipos-production
